[env:esp32-c3-supermini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200

; USB CDC on Boot is required for the ESP32-C3 Supermini to output Serial data over its USB port
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

; The default 4MB partition table already has two OTA app slots, so OTA works
; without changing partitions (keeps NVS settings intact).
;
; To flash over Wi-Fi instead of USB, uncomment these and set your device IP
; (shown on the OLED / serial at boot). If Config::Ota::PASSWORD is set, also
; add:  --auth=<password>  via upload_flags.
upload_protocol = espota
upload_port = 192.168.1.53
; upload_flags = --auth=

lib_deps = 
	adafruit/Adafruit SSD1306 @ ^2.5.7
	adafruit/Adafruit GFX Library @ ^1.11.5
	bblanchon/ArduinoJson @ ^6.21.3
